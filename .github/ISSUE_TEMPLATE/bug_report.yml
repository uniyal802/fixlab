name: Bug report
description: Report a reproducible problem in FixLab.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets or private source code. Remove sensitive data from logs before sharing.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Local
        - Browser (GitHub Pages)
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe example and exact steps.
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, Python version, model, and Docker version when relevant.
    validations:
      required: false
