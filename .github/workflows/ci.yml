name: FixLab verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -f Dockerfile.runner -t fixlab-runner:local .
      - run: python -m unittest discover -s tests -v
      - run: python -m evaluation.run_eval --check-dataset
      - run: node --check frontend/app.js
      - run: node --check docs/app.js && node --check docs/browser.js
